name: Preview YouTube public rejudge

# sho5-website の既存 Secret で、sho5-script f615c9f の再判定スクリプトをプレビューする。
# 公開リポジトリの GITHUB_TOKEN では非公開の sho5-script を checkout できない。
# tools/youtube-rejudge はそのコミットの対象ファイルとバイト列が同じで、実行前に照合する。
# --apply は付けない。公開JSONも feed-status.json も commit しない。
on:
  push:
    branches:
      - cursor/youtube-rejudge-preview-8bd1
    paths:
      - .github/workflows/youtube-rejudge-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: youtube-rejudge-preview
      cancel-in-progress: false

    steps:
      - name: Confirm the existing YouTube secret is present
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "${YOUTUBE_API_KEY}" ]; then
            echo "YOUTUBE_API_KEY is not set for sho5-website. The API was not called."
            exit 2
          fi
          echo "YOUTUBE_API_KEY is available to this job. The value is not printed."

      - name: Checkout this preview
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout public YouTube inputs
        uses: actions/checkout@v4
        with:
          ref: bb20f8bf760884a63c0ef176e7b95ebc1e54aa3a
          path: website-inputs
          persist-credentials: false
          sparse-checkout: |
            data/youtube-public.json
            data/feed-status.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preview 472 videos without applying
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          WEBSITE_SHA: bb20f8bf760884a63c0ef176e7b95ebc1e54aa3a
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_API_KEY}" ]; then
            echo "YOUTUBE_API_KEY is not set for sho5-website. The API was not called."
            exit 2
          fi
          echo "YOUTUBE_API_KEY is available to this job. The value is not printed."

          website_sha="$(git -C website-inputs rev-parse HEAD)"
          echo "website inputs ${website_sha}"
          if [ "${website_sha}" != "${WEBSITE_SHA}" ]; then
            echo "Unexpected website revision. The API was not called."
            exit 1
          fi
          check_script() {
            actual="$(sha256sum "$2" | awk '{print $1}')"
            if [ "${actual}" != "$1" ]; then
              echo "Rejudge script does not match f615c9f. The API was not called."
              exit 1
            fi
          }
          check_script 5aa656034a92e5d9ba396d1bfa51a7aa2e6021c1e096c54355303b214288e1d8 tools/youtube-rejudge/package.json
          check_script deac0bda9926556fea73d2df78a4a5beee22c71b8cb13066ace3d7c0d70910d4 tools/youtube-rejudge/rejudge-youtube-public.js
          check_script a966881c68631734c16fee014fedee86dfaa1b36fa9365b1cfa5795af2e62c27 tools/youtube-rejudge/youtube-quality.js
          check_script 44fda1ce0dbbff567a44c5ac550d8fcf4f51c659364e66dca3f921ac2adebf0e tools/youtube-rejudge/safe-url.js
          check_script bb707f790e8ec39524ff43d3034e0bf60b0eafbee19d56108f77ec9636990880 tools/youtube-rejudge/feed-status.js
          check_script 56f14886a2cbfea066f04c88b1c42d285d7c60ca4d5a39806ee59f37f30def6a tools/youtube-rejudge/sha256.js
          echo "rejudge script matches f615c9f20a6c76be0b5a9f72de8b44820d29ea2b"

          mkdir -p "${RUNNER_TEMP}/yt-in" "${RUNNER_TEMP}/yt-out" preview-out
          cp website-inputs/data/youtube-public.json "${RUNNER_TEMP}/yt-in/youtube-public.json"
          cp website-inputs/data/feed-status.json "${RUNNER_TEMP}/yt-in/feed-status.json"
          node tools/youtube-rejudge/probe-referrer.js "${RUNNER_TEMP}/yt-in/youtube-public.json" "${RUNNER_TEMP}/yt-out/referrer.txt"
          YOUTUBE_REFERRER="$(cat "${RUNNER_TEMP}/yt-out/referrer.txt")"
          echo "YouTube referrer ${YOUTUBE_REFERRER}"
          export YOUTUBE_REFERRER
          public_before="$(sha256sum "${RUNNER_TEMP}/yt-in/youtube-public.json" | awk '{print $1}')"
          status_before="$(sha256sum "${RUNNER_TEMP}/yt-in/feed-status.json" | awk '{print $1}')"

          node --input-type=module -e 'import fs from "node:fs"; const videos = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); const length = Array.isArray(videos) ? videos.length : -1; const summary = { publicVideos: length, youtubeCount: status?.youtube?.count ?? null, xCount: status?.x?.count ?? null, xHistoryCount: status?.x?.historyCount ?? null }; console.log(JSON.stringify(summary)); if (length !== 472 || status?.youtube?.count !== 472) process.exit(1);' "${RUNNER_TEMP}/yt-in/youtube-public.json" "${RUNNER_TEMP}/yt-in/feed-status.json"

          set +e
          node --import ./tools/youtube-rejudge/referrer-fetch.js tools/youtube-rejudge/rejudge-youtube-public.js \
            --public "${RUNNER_TEMP}/yt-in/youtube-public.json" \
            --status "${RUNNER_TEMP}/yt-in/feed-status.json" \
            --preview "${RUNNER_TEMP}/yt-out/preview.json" \
            > "${RUNNER_TEMP}/yt-out/stdout.txt" \
            2> "${RUNNER_TEMP}/yt-out/stderr.txt"
          code=$?
          set -e

          node --input-type=module -e 'import fs from "node:fs"; const key = process.env.YOUTUBE_API_KEY || ""; const redact = (text) => { let out = text.replace(/key=[^&\s]+/g, "key=REDACTED"); if (key) out = out.split(key).join("REDACTED"); return out; }; for (const file of process.argv.slice(1)) process.stderr.write(redact(fs.readFileSync(file, "utf8")));' "${RUNNER_TEMP}/yt-out/stdout.txt" "${RUNNER_TEMP}/yt-out/stderr.txt"

          public_after="$(sha256sum "${RUNNER_TEMP}/yt-in/youtube-public.json" | awk '{print $1}')"
          status_after="$(sha256sum "${RUNNER_TEMP}/yt-in/feed-status.json" | awk '{print $1}')"
          if [ "${public_before}" != "${public_after}" ] || [ "${status_before}" != "${status_after}" ]; then
            echo "Input files changed during preview. Discarding the preview."
            rm -f "${RUNNER_TEMP}/yt-out/preview.json"
            exit 1
          fi
          if [ ! -f "${RUNNER_TEMP}/yt-out/preview.json" ]; then
            echo "No preview was written. Public JSON was not changed."
            exit "${code}"
          fi

          node --input-type=module -e 'import fs from "node:fs"; const key = process.env.YOUTUBE_API_KEY || ""; const file = process.argv[1]; const text = fs.readFileSync(file, "utf8"); if ((key && text.includes(key)) || /[?&]key=/.test(text)) { fs.rmSync(file); console.error("Preview output contained the API key. It was not saved."); process.exit(1); } const preview = JSON.parse(text); const summary = { input: preview.input, complete: preview.complete, kept: preview.kept, belowSubscriberBar: preview.belowSubscriberBar, subscribersUnavailable: preview.subscribersUnavailable, videoUnavailable: preview.videoUnavailable, unverified: preview.unverified, other: preview.other }; const counted = summary.kept + summary.belowSubscriberBar + summary.subscribersUnavailable + summary.videoUnavailable + summary.unverified + summary.other; fs.mkdirSync("preview-out", { recursive: true }); fs.writeFileSync("preview-out/summary.json", `${JSON.stringify(summary, null, 2)}\n`); fs.copyFileSync(file, "preview-out/youtube-rejudge-preview.json"); console.log(JSON.stringify(summary, null, 2)); if (summary.input !== 472 || counted !== 472) process.exit(1);' "${RUNNER_TEMP}/yt-out/preview.json"

          {
            echo '## YouTube rejudge preview'
            echo '```json'
            cat preview-out/summary.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${code}"

      - name: Upload preview counts
        if: ${{ always() && hashFiles('preview-out/summary.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-rejudge-preview
          path: |
            preview-out/summary.json
            preview-out/youtube-rejudge-preview.json
          if-no-files-found: error
