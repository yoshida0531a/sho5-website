name: Website regression
on:
  pull_request:
  push:
    branches: [main]
    paths: ['js/**', 'scripts/**', 'tests/**', '*.html', 'photo-gallery-worker/**', '.github/workflows/regression.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
