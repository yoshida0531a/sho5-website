name: Curate public X and YouTube feeds

# 日次の選別は sho5-script の Worker twitter-to-line が、既存の JST 5:30 のサイト更新から行う。
# x-data.txt の push でこのワークフローも起動すると、同じ公開JSONを二重に書く。
on:
  workflow_dispatch:
    inputs:
      min_subscribers:
        description: 'Minimum subscriber count'
        required: false
        default: '1000'
        type: string
      min_quality_score:
        description: 'Minimum content score (0-100)'
        required: false
        default: '45'
        type: string
      rescue_score:
        description: 'Score that can keep a video below the subscriber minimum'
        required: false
        default: '60'
        type: string
      dry_run:
        description: 'Preview only. Do not write public data.'
        required: false
        default: false
        type: boolean

jobs:
  curate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: curate-feeds
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Curate X
        id: curate_x
        continue-on-error: true
        env:
          DRY_RUN: ${{ (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') && 'true' || 'false' }}
        run: node scripts/curate-x.js

      - name: Curate YouTube
        id: curate_youtube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MIN_SUBSCRIBERS: ${{ github.event.inputs.min_subscribers || '1000' }}
          MIN_QUALITY_SCORE: ${{ github.event.inputs.min_quality_score || '45' }}
          RESCUE_SCORE: ${{ github.event.inputs.rescue_score || '60' }}
          DRY_RUN: ${{ (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') && 'true' || 'false' }}
          API_DELAY_MS: '100'
        run: node scripts/curate-youtube.js

      - name: Commit public data
        if: ${{ !cancelled() && steps.curate_x.outcome != 'skipped' && github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        run: |
          set -eu
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          candidates=(data/x-public.json data/x-judgments.json data/youtube-public.json data/youtube-quality-cache.json data/feed-status.json)
          changed=()
          for f in "${candidates[@]}"; do
            if [ ! -f "$f" ]; then
              continue
            fi
            if ! git cat-file -e "HEAD:$f" 2>/dev/null || ! git diff --quiet HEAD -- "$f"; then
              changed+=("$f")
            fi
          done
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "公開データに変更はありません。"
            exit 0
          fi
          stage=$(mktemp -d)
          for f in "${changed[@]}"; do
            mkdir -p "$stage/$(dirname "$f")"
            cp "$f" "$stage/$f"
          done
          pushed=0
          for attempt in 1 2 3; do
            git reset --hard HEAD
            for f in "${changed[@]}"; do
              rm -f "$f"
            done
            git fetch origin main
            git checkout -B main origin/main
            for f in "${changed[@]}"; do
              mkdir -p "$(dirname "$f")"
              cp "$stage/$f" "$f"
            done
            git add "${changed[@]}"
            if git diff --cached --quiet; then
              echo "公開データに変更はありません。"
              exit 0
            fi
            git commit -m "chore: curate public X and YouTube feeds"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git reset --hard HEAD~1
          done
          if [ "$pushed" -ne 1 ]; then
            echo "公開データの push に失敗しました。"
            exit 1
          fi

      - name: Fail if either feed failed
        if: ${{ !cancelled() && (steps.curate_x.outcome == 'failure' || steps.curate_youtube.outcome == 'failure') }}
        run: exit 1
