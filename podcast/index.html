<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sho5 Weekly | sho5.org</title>
  <meta name="description" content="阪神タイガース・谷端将伍選手を応援する週刊ポッドキャスト Sho5 Weekly。">
  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fafafa; color: #222; }
    main { width: min(740px, calc(100% - 36px)); margin: 0 auto; padding: 55px 0 80px; }
    header { border-bottom: 2px solid #222; padding-bottom: 25px; margin-bottom: 32px; }
    h1 { font-size: clamp(2rem,5vw,3rem); margin: 0 0 10px; letter-spacing: -.035em; }
    .sub { margin: 0; line-height: 1.8; color: #555; }
    h2 { font-size: 1.4rem; margin: 0 0 18px; }
    article { padding: 25px 0; border-bottom: 1px solid #ddd; }
    article h3 { margin: 4px 0 12px; font-size: 1.25rem; line-height: 1.5; }
    time, .duration { font-size: .88rem; color: #666; }
    .description { line-height: 1.8; overflow-wrap: anywhere; }
    audio { display: block; width: 100%; margin-top: 18px; }
    .notice { color: #666; line-height: 1.8; }
    footer { padding-top: 35px; color: #777; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Sho5 Weekly</h1>
      <p class="sub">阪神タイガース・谷端将伍選手を応援する週刊ポッドキャスト。<br>試合や話題を振り返ります。</p>
    </header>
    <section aria-labelledby="episodes-heading">
      <h2 id="episodes-heading">エピソード</h2>
      <div id="episodes" aria-live="polite"><p class="notice">エピソードを準備しています。</p></div>
    </section>
    <footer>sho5.org · AIが生成した音声を使用しています。</footer>
  </main>
  <script>
    (async () => {
      const container = document.getElementById('episodes');
      try {
        const response = await fetch('./episodes.json', { cache: 'no-store' });
        if (!response.ok) return;
        const episodes = await response.json();
        if (!Array.isArray(episodes) || !episodes.length) return;
        container.replaceChildren();
        for (const episode of episodes
          .filter(e => e && e.title && e.audioUrl && /^https:\/\//.test(e.audioUrl))
          .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))) {
          const article = document.createElement('article');
          const meta = document.createElement('div');
          if (episode.date && /^\d{4}-\d{2}-\d{2}$/.test(episode.date)) {
            const date = document.createElement('time');
            date.dateTime = episode.date;
            date.textContent = episode.date;
            meta.append(date);
          }
          if (episode.duration) {
            const duration = document.createElement('span');
            duration.className = 'duration';
            duration.textContent = ' · ' + episode.duration;
            meta.append(duration);
          }
          const title = document.createElement('h3');
          title.textContent = episode.title;
          const description = document.createElement('p');
          description.className = 'description';
          description.textContent = episode.description || '';
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.preload = 'none';
          audio.src = episode.audioUrl;
          article.append(meta, title, description, audio);
          container.append(article);
        }
        if (!container.children.length) container.textContent = 'エピソードを準備しています。';
      } catch {
        // Remain in a safe pre-release placeholder state.
      }
    })();
  </script>
</body>
</html>
