<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluesky Updates - Shogo Fan Site</title>
  <meta name="description" content="谷端選手に関するBlueskyの投稿を紹介しています。">
  <link rel="canonical" href="https://sho5.org/bsky.html">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Yu Gothic', YuGothic, sans-serif;
      background-color: white; color: black;
    }
    .top-link {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 24px;
      color: black;
      text-decoration: none;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }
    .top-link:hover { text-decoration: underline; }
    header {
      text-align: center; font-size: 28px;
      font-weight: bold; margin: 20px 0;
    }
    .post-feed {
      width: calc(100% - 20px); max-width: 800px;
      margin: 0 auto; padding: 20px;
    }
    @media (max-width: 600px) {
      .post-feed { width: 100%; padding: 10px; }
    }
    #search {
      width: 100%; padding: 10px; font-size: 16px;
      margin-bottom: 20px; border: 1px solid #ccc;
      border-radius: 5px;
    }
    .post-item {
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px; padding-bottom: 10px;
    }
    .post-item h3 { margin: 5px 0; font-size: 18px; }
    .post-item h3 a { color: black; text-decoration: none; }
    .post-handle { margin: 5px 0; font-size: 13px; color: #666; overflow-wrap: anywhere; }
    .post-item h3 { overflow-wrap: anywhere; }
    .post-item .date { margin: 5px 0; font-size: 12px; color: #666; }
    .post-item .post-text {
      margin: 10px 0; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .post-link {
      display: inline-block;
      margin: 12px 0;
      padding: 8px 16px;
      background-color: transparent;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .post-link:hover, .post-link:active, .post-link:focus {
      background-color: #FFD700;
      color: #000;
    }
    #past-posts-btn, #retry-feed-btn {
      display: block;
      margin: 20px auto;
      padding: 12px 24px;
      background-color: transparent;
      color: #000;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #past-posts-btn:hover, #past-posts-btn:active, #past-posts-btn:focus {
      background-color: #FFD700;
      color: #000;
    }
    .hidden { display: none !important; }
    .scroll-to-top {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 50px; height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white; border: none; border-radius: 50%;
      font-size: 24px; cursor: pointer; z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      transition: background-color 0.3s ease;
    }
    .scroll-to-top:hover { background-color: rgba(0, 0, 0, 0.9); }
    footer { text-align: center; font-size: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <a href="index.html" class="top-link" aria-label="トップへ戻る">←</a>
  <header>Bluesky Updates</header>
  <section class="post-feed">
    <p>谷端選手に関するBlueskyの投稿</p>
    <input type="search" id="search" placeholder="投稿・投稿者を検索" aria-label="Blueskyの投稿・投稿者を検索">
    <p id="feed-message" role="status" aria-live="polite">読み込み中…</p>
    <div id="post-container"></div>
    <button id="past-posts-btn" type="button" class="hidden">さらに過去の投稿を見る</button>

  </section>
  <footer>Copyright © 2023-2026 Akira Yoshida.</footer>
  <button class="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="トップに戻る">↑</button>
  <script type="module">
    import { mountBlueskyFeed } from './js/bluesky-feed.js?v=20261025-first-cycle';
    mountBlueskyFeed({ document });
  </script>
</body>
</html>
