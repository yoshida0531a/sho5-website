<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 最終更新: 2025/11/5 6:30:06 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Updates - Shogo Fan Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Yu Gothic', YuGothic, sans-serif;
      background-color: white; color: black;
    }
    .top-link {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 24px;
      color: black;
      text-decoration: none;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }
    .top-link:hover {
      text-decoration: underline;
    }
    header {
      text-align: center; font-size: 28px;
      font-weight: bold; margin: 20px 0;
    }
    .tweet-feed {
      width: calc(100% - 20px); max-width: 800px;
      margin: 0 auto; padding: 20px;
    }
    @media (max-width: 600px) {
      .tweet-feed { width: 100%; padding: 10px; }
    }
    #search {
      width: 100%; padding: 10px; font-size: 16px;
      margin-bottom: 20px; border: 1px solid #ccc;
      border-radius: 5px;
    }
    .tweet-item {
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px; padding-bottom: 10px;
    }
    .tweet-item h3 { margin: 5px 0; font-size: 18px; }
    .tweet-item h3 a { color: black; text-decoration: none; }
    .tweet-item .date { margin: 5px 0; font-size: 12px; color: #666; }
    .tweet-item .tweet-text {
      margin: 10px 0; font-size: 14px; line-height: 1.5;
    }
    .tweet-link {
      display: inline-block;
      margin: 12px 0;
      padding: 8px 16px;
      background-color: transparent;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .tweet-link:hover,
    .tweet-link:active,
    .tweet-link:focus {
      background-color: #FFD700;
      color: #000;
    }
    #more-posts-btn {
      display: block;
      margin: 20px auto;
      padding: 12px 24px;
      background-color: transparent;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    #more-posts-btn:hover,
    #more-posts-btn:active,
    #more-posts-btn:focus {
      background-color: #FFD700;
      color: #000;
    }
    #more-posts-btn.hidden {
      display: none;
    }
    .scroll-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }
    .scroll-to-top:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }
    footer { text-align: center; font-size: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <a href="index.html" class="top-link">←</a>
  <header>X Updates</header>
  <section class="tweet-feed">
    <input type="text" id="search" placeholder="Search tweets...">
    <div id="tweet-container">
      <!-- Tweets are loaded from data/x-public.json -->
    </div>
    <button id="more-posts-btn">さらに過去の投稿を見る</button>
  </section>
  <footer>Copyright © 2023-2025 Akira Yoshida.</footer>
  <button class="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="トップに戻る">↑</button>
  <script type="module">
    import { snowflakeToDate, formatJaDate, filterFeed } from './js/feed-behavior.js';
    import { renderTweet } from './js/feed-render.js';

    const searchInput = document.getElementById('search');
    const tweetContainer = document.getElementById('tweet-container');
    const morePostsBtn = document.getElementById('more-posts-btn');
    let records = [];
    let currentWeeksToShow = 0;

    function showMessage(message) {
      tweetContainer.replaceChildren();
      const paragraph = document.createElement('p');
      paragraph.textContent = message;
      tweetContainer.appendChild(paragraph);
      morePostsBtn.classList.add('hidden');
    }

    function updateVisibility() {
      if (records.length === 0) {
        morePostsBtn.classList.add('hidden');
        return;
      }
      const result = filterFeed(records, {
        searchQuery: searchInput.value,
        weeksToShow: currentWeeksToShow,
        mostRecentDate: records[0].date,
      });
      records.forEach((record, index) => {
        record.node.style.display = result.visible[index] ? 'block' : 'none';
      });
      if (result.hasMore) morePostsBtn.classList.remove('hidden');
      else morePostsBtn.classList.add('hidden');
    }

    fetch('data/x-public.json')
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data)) throw new Error('invalid');
        data.forEach((tweet) => {
          const match = typeof tweet.tweetUrl === 'string' && tweet.tweetUrl.match(/status\/(\d+)/);
          if (!match) return;
          const tweetDate = snowflakeToDate(match[1]);
          const node = renderTweet(document, {
            userName: tweet.userName,
            text: tweet.text,
            tweetUrl: tweet.tweetUrl,
            dateIso: tweetDate.toISOString(),
            dateLabel: formatJaDate(tweetDate),
          });
          records.push({
            node,
            username: node.getAttribute('data-username'),
            text: node.getAttribute('data-text'),
            date: tweetDate,
          });
        });
        records.sort((a, b) => b.date - a.date);
        if (records.length === 0) {
          showMessage('いま公開できる投稿はありません。');
          return;
        }
        tweetContainer.replaceChildren();
        records.forEach((record) => tweetContainer.appendChild(record.node));
        updateVisibility();
      })
      .catch(() => {
        showMessage('公開用の投稿を読み込めませんでした。');
      });

    searchInput.addEventListener('input', updateVisibility);
    morePostsBtn.addEventListener('click', () => {
      currentWeeksToShow += 1;
      updateVisibility();
    });
  </script>
</body>
</html>
