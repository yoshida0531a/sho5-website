<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 最終更新: 2025/11/5 6:30:06 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Updates - Shogo Fan Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Yu Gothic', YuGothic, sans-serif;
      background-color: white; color: black;
      overflow-x: hidden;
    }
    .top-link {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 24px;
      color: black;
      text-decoration: none;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }
    .top-link:hover {
      text-decoration: underline;
    }
    header {
      text-align: center; font-size: 28px;
      font-weight: bold; margin: 20px 0;
    }
    .tweet-feed {
      width: calc(100% - 20px); max-width: 800px;
      margin: 0 auto; padding: 20px;
    }
    @media (max-width: 600px) {
      .tweet-feed { width: 100%; padding: 10px; }
    }
    #search {
      width: 100%; padding: 10px; font-size: 16px;
      margin-bottom: 20px; border: 1px solid #ccc;
      border-radius: 5px;
    }
    .tweet-item {
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px; padding-bottom: 10px;
    }
    .tweet-item h3 { margin: 5px 0; font-size: 18px; }
    .tweet-item h3 a { color: black; text-decoration: none; }
    .tweet-item .date { margin: 5px 0; font-size: 12px; color: #666; }
    .tweet-item .tweet-text {
      margin: 10px 0; font-size: 14px; line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .tweet-link {
      display: inline-block;
      margin: 12px 0;
      padding: 8px 16px;
      background-color: transparent;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .tweet-link:hover,
    .tweet-link:active,
    .tweet-link:focus {
      background-color: #FFD700;
      color: #000;
    }
    #past-posts-btn {
      display: block;
      margin: 20px auto;
      padding: 12px 24px;
      background-color: transparent;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      max-width: 100%;
      transition: all 0.3s ease;
    }
    #past-posts-btn:hover,
    #past-posts-btn:active,
    #past-posts-btn:focus {
      background-color: #FFD700;
      color: #000;
    }
    #past-posts-btn.hidden {
      display: none;
    }
    .scroll-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }
    .scroll-to-top:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }
    footer { text-align: center; font-size: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <a href="index.html" class="top-link">←</a>
  <header>X Updates</header>
  <section class="tweet-feed">
    <input type="text" id="search" placeholder="Search tweets...">
    <div id="tweet-container"></div>
    <button id="past-posts-btn" type="button">過去の投稿を見る</button>
    <div id="past-container"></div>
  </section>
  <footer>Copyright © 2023-2025 Akira Yoshida.</footer>
  <button class="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="トップに戻る">↑</button>
  <script type="module">
    import { snowflakeToDate, formatJaDate } from './js/feed-behavior.js';
    import { renderTweet } from './js/feed-render.js';
    import { loadArchiveFeed, loadTodayFeed, once } from './js/daily-feed.js';

    const searchInput = document.getElementById('search');
    const tweetContainer = document.getElementById('tweet-container');
    const pastContainer = document.getElementById('past-container');
    const pastButton = document.getElementById('past-posts-btn');
    let todayItems = [];
    let pastItems = [];
    let pastLoaded = false;
    let todayMessage = '';
    let pastError = '';

    function tweetDate(tweet) {
      const match = typeof tweet.tweetUrl === 'string' && tweet.tweetUrl.match(/status\/(\d+)/);
      return match ? snowflakeToDate(match[1]) : new Date(0);
    }

    function renderTweetItem(tweet) {
      const date = tweetDate(tweet);
      return renderTweet(document, {
        userName: tweet.userName,
        text: tweet.text,
        tweetUrl: tweet.tweetUrl,
        dateIso: date.toISOString(),
        dateLabel: formatJaDate(date),
      });
    }

    function matches(tweet, query) {
      return `${tweet.userName || ''} ${tweet.text || ''}`.toLowerCase().includes(query);
    }

    function sorted(items) {
      return items.slice().sort((a, b) => tweetDate(b) - tweetDate(a));
    }

    function showStatus(message) {
      tweetContainer.replaceChildren();
      const paragraph = document.createElement('p');
      paragraph.id = 'today-message';
      paragraph.textContent = message;
      tweetContainer.appendChild(paragraph);
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const today = sorted(todayItems).filter((tweet) => !query || matches(tweet, query));
      const past = pastLoaded ? sorted(pastItems).filter((tweet) => !query || matches(tweet, query)) : [];
      tweetContainer.replaceChildren();
      pastContainer.replaceChildren();
      if (!query && today.length === 0) showStatus(todayMessage);
      else if (query && today.length === 0 && past.length === 0) showStatus('一致する投稿はありません。');
      else today.forEach((tweet) => tweetContainer.appendChild(renderTweetItem(tweet)));
      past.forEach((tweet) => pastContainer.appendChild(renderTweetItem(tweet)));
      if (pastError) {
        const paragraph = document.createElement('p');
        paragraph.textContent = pastError;
        pastContainer.appendChild(paragraph);
      }
      if (pastLoaded) pastButton.classList.add('hidden');
    }

    const loadPast = once(() => loadArchiveFeed(fetch, 'x', new Date()));

    async function ensurePast() {
      if (pastLoaded) return;
      const result = await loadPast();
      if (pastLoaded) return;
      if (result.kind !== 'ready') {
        pastError = result.message;
        pastLoaded = true;
        return;
      }
      const todayIds = new Set(todayItems.map((tweet) => (tweet.tweetUrl || '').match(/status\/(\d+)/)?.[1]).filter(Boolean));
      pastItems = result.items.filter((tweet) => {
        const id = (tweet.tweetUrl || '').match(/status\/(\d+)/)?.[1];
        return !id || !todayIds.has(id);
      });
      pastLoaded = true;
    }

    loadTodayFeed(fetch, 'x', new Date()).then((result) => {
      if (result.kind === 'ready') todayItems = result.items;
      else todayMessage = result.message;
      render();
    });

    searchInput.addEventListener('input', async () => {
      if (searchInput.value.trim() && !pastLoaded) await ensurePast();
      render();
    });
    pastButton.addEventListener('click', async () => {
      await ensurePast();
      render();
    });
  </script>
</body>
</html>
