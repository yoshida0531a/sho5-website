<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 最終更新: 2025/11/5 6:30:06 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Updates - Shogo Fan Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Yu Gothic', YuGothic, sans-serif;
      background-color: white; color: black;
    }
    .top-link {
      position: fixed;
      top: 10px;
      left: 20px;
      font-size: 24px;
      color: black;
      text-decoration: none;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }
    .top-link:hover {
      text-decoration: underline;
    }
    header {
      text-align: center; font-size: 28px;
      font-weight: bold; margin: 20px 0;
    }
    .video-feed {
      width: calc(100% - 20px); max-width: 800px;
      margin: 0 auto; padding: 20px;
    }
    @media (max-width: 600px) {
      .video-feed { width: 100%; padding: 10px; }
    }
    #search {
      width: 100%; padding: 10px; font-size: 16px;
      margin-bottom: 20px; border: 1px solid #ccc;
      border-radius: 5px;
    }
    .video-item {
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px; padding-bottom: 10px;
    }
    .video-item h3 { margin: 5px 0; font-size: 18px; }
    .video-item h3 a { color: black; text-decoration: none; }
    .video-item .date { margin: 5px 0; font-size: 12px; color: #666; }
    .video-item .description {
      margin: 10px 0; font-size: 14px; line-height: 1.5;
      max-height: 90px; overflow: hidden;
    }
    .video-link {
      display: inline-block;
      margin: 12px 0;
      padding: 8px 16px;
      background-color: transparent;
      color: #000;
      text-decoration: none;
      border: 2px solid #000;
      border-radius: 5px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .video-link:hover,
    .video-link:active,
    .video-link:focus {
      background-color: #FFD700;
      color: #000;
    }
    .scroll-to-top {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease;
    }
    .scroll-to-top:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }
    footer { text-align: center; font-size: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <a href="index.html" class="top-link">←</a>
  <header>YouTube Updates</header>
  <section class="video-feed">
    <input type="text" id="search" placeholder="Search videos...">
    <div id="video-container">
      <!-- Videos are loaded from data/youtube-public.json -->
    </div>
  </section>
  <footer>Copyright © 2023-2025 Akira Yoshida.</footer>
  <button class="scroll-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="トップに戻る">↑</button>
  <script type="module">
    import { parseCustomDate, formatVideoDate, sortNewest, videoMatches } from './js/feed-behavior.js';
    import { renderVideo } from './js/feed-render.js';

    const searchInput = document.getElementById('search');
    const videoContainer = document.getElementById('video-container');
    let records = [];

    function showMessage(message) {
      videoContainer.replaceChildren();
      const paragraph = document.createElement('p');
      paragraph.textContent = message;
      videoContainer.appendChild(paragraph);
    }

    function updateVisibility() {
      records.forEach((record) => {
        record.node.style.display = videoMatches(record, searchInput.value) ? 'block' : 'none';
      });
    }

    fetch('data/youtube-public.json')
      .then((response) => {
        if (!response.ok) throw new Error(String(response.status));
        return response.json();
      })
      .then((data) => {
        if (!Array.isArray(data)) throw new Error('invalid');
        const sorted = sortNewest(data, (video) => parseCustomDate(video.publishedAt));
        sorted.forEach((video) => {
          const parsed = parseCustomDate(video.publishedAt);
          const node = renderVideo(document, {
            title: video.title,
            description: video.description,
            url: video.url,
            publishedAt: video.publishedAt,
            dateLabel: formatVideoDate(parsed),
          });
          records.push({
            node,
            title: node.getAttribute('data-title'),
            description: node.getAttribute('data-description'),
          });
        });
        if (records.length === 0) {
          showMessage('いま公開できる動画はありません。');
          return;
        }
        videoContainer.replaceChildren();
        records.forEach((record) => videoContainer.appendChild(record.node));
      })
      .catch(() => {
        showMessage('公開用の動画を読み込めませんでした。');
      });

    searchInput.addEventListener('input', updateVisibility);
  </script>
</body>
</html>
